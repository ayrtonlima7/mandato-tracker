name: Atualizar dados

# Diário: notícias (fetch-news, fetch-general, review-match, build-data).
# Semanal (segunda): inclui também o scrape das promessas do G1.
# Horários em UTC (BRT = UTC-3).
on:
  schedule:
    - cron: '0 9 * * 0,2-6' # domingo e terça a sábado: só notícias
    - cron: '0 9 * * 1' # segunda: completo (G1 + notícias)
  workflow_dispatch:
    inputs:
      modo:
        description: 'daily = só notícias; weekly = G1 + notícias'
        type: choice
        options: [daily, weekly]
        default: daily

permissions:
  contents: write

# Evita duas execuções simultâneas commitando os mesmos arquivos.
concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Define o modo
        id: modo
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "modo=${{ inputs.modo }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 9 * * 1" ]; then
            echo "modo=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "modo=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Coleta e monta os dados
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npm run data:${{ steps.modo.outputs.modo }}

      - name: Build de sanidade
        run: npm run build

      - name: Commita se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          # Ignora diffs que só mudam o carimbo de data do build-data.
          if git diff --cached --quiet -I'^(// Gerado em|export const generatedAt)'; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "chore(data): atualização automática (${{ steps.modo.outputs.modo }})"
            git push
          fi
